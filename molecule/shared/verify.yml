---
- name: Verify kernel_config role
  hosts: all
  gather_facts: true
  tasks:
    - name: Check disabled module configuration files
      ansible.builtin.stat:
        path: /etc/modprobe.d/{{ item }}-disabled.conf
      loop: "{{ kernel_disable_modules | default([]) }}"
      register: kernel_disabled_module_stats
      tags:
        - kernel_config
        - validate

    - name: Assert disabled module configuration files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        quiet: true
      loop: "{{ kernel_disabled_module_stats.results }}"
      loop_control:
        label: "{{ item.stat.path | default(item.item) }}"
      tags:
        - kernel_config
        - validate

    - name: Check blacklisted module configuration files
      ansible.builtin.stat:
        path: /etc/modprobe.d/{{ item }}-blacklist.conf
      loop: "{{ kernel_blacklist_modules | default([]) }}"
      register: kernel_blacklist_module_stats
      tags:
        - kernel_config
        - validate

    - name: Assert blacklisted module configuration files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        quiet: true
      loop: "{{ kernel_blacklist_module_stats.results }}"
      loop_control:
        label: "{{ item.stat.path | default(item.item) }}"
      tags:
        - kernel_config
        - validate

    - name: Read role-managed sysctl drop-in
      ansible.builtin.slurp:
        src: /etc/sysctl.d/99-kernel_config.conf
      register: kernel_sysctl_dropin
      tags:
        - kernel_config
        - validate

    - name: Assert sysctl values are persisted in role-managed drop-in
      ansible.builtin.assert:
        that:
          - >-
            (item.name ~ ' = ' ~ (item.value | string)) in
            (kernel_sysctl_dropin.content | b64decode).splitlines()
        quiet: true
      loop: "{{ kernel_sysctl | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      tags:
        - kernel_config
        - validate

    - name: Read configured sysctl runtime values on non-container hosts
      ansible.builtin.command:
        cmd: sysctl -n {{ item.name }}
      changed_when: false
      loop: "{{ kernel_sysctl | default([]) }}"
      register: kernel_sysctl_values
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'lxc', 'containerd', 'container']
      tags:
        - kernel_config
        - validate

    - name: Assert sysctl runtime values match requested configuration on non-container hosts
      ansible.builtin.assert:
        that:
          - (item.stdout | trim) == (item.item.value | string)
        quiet: true
      loop: "{{ kernel_sysctl_values.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'lxc', 'containerd', 'container']
      tags:
        - kernel_config
        - validate
