---
- name: Ensure udev rules directory exists
  ansible.builtin.file:
    path: /etc/udev/rules.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - kernel_config
    - config

- name: Ensure udev power-saving rule templates are present
  ansible.builtin.template:
    src: '{{ item }}.rules.j2'
    dest: /etc/udev/rules.d/{{ item }}.rules
    owner: root
    group: root
    mode: '0644'
  loop:
    - 90-sata-link-pm
    - 50-bluetooth
    - 50-usb-powersave
    - 81-wifi-powersave
    - 81-wol
    - 90-pci-autosuspend
    - 90-ahci-ata-autosuspend
    - 90-scsi-autosuspend
  notify: Reload udev
  tags:
    - kernel_config
    - config
